name: vstu_app
description: "Расписание занятий ВГТУ: список групп, пары, числитель и знаменатель."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  webview_flutter: ^4.14.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
